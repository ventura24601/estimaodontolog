  <body>
    <!-- Preloader estático (roda antes e em paralelo ao JS): logo em traço + cortina que sobe em 1.2s.
         A imagem do hero já pinta por baixo. O React remove #boot quando monta. -->
    <style>
      #boot{position:fixed;inset:0;z-index:99;pointer-events:none}#boot-hero{position:fixed;inset:0;z-index:40;pointer-events:none;transition:opacity .4s}
      #boot-hero{background:#1C1C1A}
      #boot-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      #boot-hero .bi{opacity:0;transform:translateY(16px);animation:bootIn 1s cubic-bezier(.22,1,.36,1) var(--d) forwards}
      #boot-hero .bl{opacity:0;transform:translateY(110%);animation:bootIn 1.1s cubic-bezier(.22,1,.36,1) var(--d) forwards}
      @keyframes bootIn{to{opacity:1;transform:none}}
      #boot-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,28,26,.55) 0%,rgba(28,28,26,.25) 40%,rgba(28,28,26,.85) 100%)}
      #boot{background:#E9E1D6;display:grid;place-items:center;animation:bootLift .45s cubic-bezier(.22,1,.36,1) .75s forwards}
      #boot svg{width:min(70vw,320px);color:#232B4F;animation:bootLogo .4s cubic-bezier(.22,1,.36,1) .75s forwards}
      #boot path{stroke:currentColor;stroke-width:.6;stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:draw .7s cubic-bezier(.22,1,.36,1) forwards,fillIn .35s ease .45s forwards}
      #boot g path{stroke:#C8A161}
      #boot.np,#boot.np svg{animation:none}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes fillIn{to{fill-opacity:1}}
      @keyframes bootLift{to{clip-path:inset(0 0 100% 0)}}
      @keyframes bootLogo{to{transform:translateY(-40px);opacity:0}}
      @media (prefers-reduced-motion:reduce){#boot{animation-delay:.2s;animation-duration:.01s}#boot path{animation:none;stroke-dashoffset:0;fill-opacity:1}#boot-hero .bi,#boot-hero .bl{animation:none;opacity:1;transform:none}}
    </style>
    <div id="boot-hero" class="h" aria-hidden="true">
        <picture>
          <source type="image/avif" srcset="/img/consultorio-2-480.avif 480w, /img/consultorio-2-960.avif 960w" sizes="100vw" />
          <img src="/img/consultorio-2-960.webp" srcset="/img/consultorio-2-480.webp 480w, /img/consultorio-2-960.webp 960w" sizes="100vw" alt="" fetchpriority="high" width="960" height="640" />
        </picture>
        <!-- Espelho estático do conteúdo do Hero (src/components/sections/Hero.tsx): mantenha os textos em sincronia -->
        <div class="container-site relative z-[1] flex h-full flex-col justify-end pb-28 text-base md:pb-32">
          <p class="bi mb-8 flex items-center gap-3 text-eyebrow uppercase text-base/75" style="--d:1.2s"><span class="h-px w-8 bg-accent"></span> Odontologia em Pelotas</p>
          <h1 class="font-serif font-normal max-w-[14ch] text-display text-base">
            <span class="block overflow-hidden pb-[0.08em]"><span class="bl block" style="--d:1.3s">Seu sorriso,</span></span>
            <span class="block overflow-hidden pb-[0.08em]"><span class="bl block" style="--d:1.42s"><em class="font-serif italic text-accent">cuidado</em> com precisão.</span></span>
          </h1>
          <div class="mt-10 flex flex-col gap-8 md:flex-row md:items-end md:justify-between">
            <p class="bi max-w-md text-lead text-base/80" style="--d:1.5s">Diagnóstico que você enxerga e cuidado que você sente, do check-up ao implante.</p>
            <div class="bi flex flex-wrap gap-3" style="--d:1.6s">
              <span class="group relative inline-flex h-14 items-center gap-3 overflow-hidden rounded-full px-7 text-[15px] font-medium tracking-tight bg-accent text-ink"><span class="h-[22px] w-[22px]"></span><span>Agendar pelo WhatsApp</span></span>
              <span class="group relative inline-flex h-14 items-center gap-3 overflow-hidden rounded-full px-7 text-[15px] font-medium tracking-tight border border-base/30 text-base"><span>Conhecer tratamentos</span><span class="h-4 w-4"></span></span>
            </div>
          </div>
        </div>
    </div>
    <div id="boot" class="c" aria-hidden="true"><!--BOOT_LOGO--></div>
    <script>
      // Fora da home: a cortina permanece até o React montar a página certa
      if (location.pathname !== '/') {
        document.getElementById('boot').classList.add('np');
        document.getElementById('boot-hero').remove();
      }
    </script>
    <div id="root"></div>

    </noscript>
